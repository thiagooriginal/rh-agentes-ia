version: '3.8'

services:
  salao-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: salao_gestao_ia
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - NODE_ENV=production
    volumes:
      - ./data:/app/data
      - ./auth_info_baileys:/app/auth_info_baileys
      - ./auth_info_portal:/app/auth_info_portal
      - ./google_credentials.json:/app/google_credentials.json
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
